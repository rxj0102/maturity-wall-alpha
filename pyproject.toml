[project]
name = "maturity-wall-alpha"
version = "0.1.0"
description = "Research code for maturity-wall-alpha"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "pandas>=2.1.0",
    "numpy>=1.25.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.13.0",
    "statsmodels>=0.14.0",
    "scipy>=1.11.0",
    "yfinance>=0.2.31",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "jupyter>=1.0.0",
    "notebook>=7.0.0",
    "tqdm>=4.66.0",
    "pyarrow>=13.0.0",
    "scikit-learn>=1.3.0",
    "python-dateutil>=2.8.2",
    "fredapi>=0.5.1",
    "ipykernel>=6.25.0",
    "ipywidgets>=8.1.0",
    "pytest>=7.0"
]

[dependency-groups]
dev = ["pytest>=7.4"]

[tool.uv]
package = false
